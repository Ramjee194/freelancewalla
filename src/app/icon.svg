<svg viewBox="0 0 160 160" width="160" height="160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring-grad-fav" x1="10" y1="20" x2="150" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="body-grad-fav" x1="30" y1="20" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="case-grad-fav" x1="100" y1="20" x2="140" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Background Shield for Favicon clarity -->
  <rect width="160" height="160" rx="36" fill="#0f172a"/>

  <!-- Glowing Outer Orbit Ring -->
  <ellipse cx="78" cy="82" rx="64" ry="40" stroke="url(#ring-grad-fav)" stroke-width="9" stroke-linecap="round" fill="none" transform="rotate(-28 78 82)"/>

  <!-- Executive Head -->
  <circle cx="78" cy="32" r="14" fill="#ffffff"/>

  <!-- Executive Torso / Suit -->
  <path d="M62 50 L94 50 L88 80 L66 80 Z" fill="#ffffff"/>
  
  <!-- Tie Accent (Electric Cyan) -->
  <path d="M75 50 L81 50 L79 68 L77 68 Z" fill="#38bdf8"/>

  <!-- Left Arm Extended Backwards -->
  <path d="M64 52 Q44 62 30 65" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Right Arm Forward Holding Briefcase -->
  <path d="M90 52 L112 36" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Briefcase -->
  <g transform="rotate(22 112 36)">
    <rect x="106" y="20" width="36" height="26" rx="4" fill="#38bdf8"/>
    <!-- Handle -->
    <path d="M117 20 V14 Q117 10 124 10 Q131 10 131 14 V20" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Legs in Full Power Stride -->
  <path d="M68 78 Q42 94 28 110" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <ellipse cx="25" cy="111" rx="9" ry="5" fill="#ffffff"/>

  <path d="M86 78 Q106 94 126 98" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <ellipse cx="127" cy="98" rx="9" ry="5" fill="#ffffff"/>
</svg>
